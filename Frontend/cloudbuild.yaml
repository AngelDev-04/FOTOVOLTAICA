# ============================================
# Cloud Build Configuration - Frontend
# ============================================
# Este archivo configura el proceso de build en GCP
# para el Frontend con React + Vite

steps:
  # Step 1: Build Docker image con build argument
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fotovoltaica-frontend'
      - '--build-arg'
      - 'VITE_API_URL=${_VITE_API_URL}'
      - '-f'
      - 'Frontend/Dockerfile'
      - 'Frontend'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/fotovoltaica-frontend'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fotovoltaica-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/fotovoltaica-frontend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'

substitutions:
  _VITE_API_URL: 'https://fotovoltaica-892407171632.us-central1.run.app'

images:
  - 'gcr.io/$PROJECT_ID/fotovoltaica-frontend'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
