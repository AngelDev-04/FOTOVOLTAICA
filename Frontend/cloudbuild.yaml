# Cloud Build Configuration - Frontend
steps:
  # Build Docker image with build argument
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=https://fotovoltaica-892407171632.us-central1.run.app'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fotovoltaica-frontend'
      - '.'

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/fotovoltaica-frontend'

images:
  - 'gcr.io/$PROJECT_ID/fotovoltaica-frontend'
